{% extends "base.html" %}

{% block title %}Kelola Kategori Buku - Perpustakaan Digital{% endblock %}

{% block content %}
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; align-items: flex-start;">
  <div class="card">
    <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Tambah Kategori Baru</h2>
    <form method="POST" action="/admin/categories/create">
      <div class="form-group">
        <label class="form-label" for="name">Nama Kategori</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Contoh: Sains Terapan" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Deskripsi</label>
        <textarea id="description" name="description" class="form-control" rows="3" placeholder="Deskripsi singkat kategori"></textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Tambah Kategori</button>
    </form>
  </div>

  <div class="card">
    <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Daftar Kategori Buku</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Nama Kategori</th>
            <th>Deskripsi</th>
            <th style="text-align: right;">Aksi</th>
          </tr>
        </thead>
        <tbody>
          {% for cat in categories %}
            <tr>
              <td><strong>{{ cat.name }}</strong></td>
              <td>{{ cat.description or '-' }}</td>
              <td style="text-align: right;">
                <form method="POST" action="/admin/categories/{{ cat.id }}/delete" onsubmit="return confirm('Apakah Anda yakin ingin menghapus kategori ini?');" style="margin: 0;">
                  <button type="submit" class="btn btn-danger btn-sm">Hapus</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
