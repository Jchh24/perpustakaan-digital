services:
  - type: web
    name: perpustakaan-digital
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: perpustakaan-digital-db
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true

databases:
  - name: perpustakaan-digital-db
    plan: free
